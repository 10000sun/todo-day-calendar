name: release
# v로 시작하는 태그(예: v1.0.0)를 push하면 APK를 GitHub Release에 첨부한다
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build release APK
        env:
          TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: VERSION_NAME="${TAG#v}" gradle :app:assembleRelease --no-daemon
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "todo-day-calendar-$TAG.apk"
          gh release create "$TAG" "todo-day-calendar-$TAG.apk" --title "$TAG" --generate-notes
